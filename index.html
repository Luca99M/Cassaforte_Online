<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Andamento">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cassaforte — Andamento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f172a; color: #1e293b; font-size: 15px;
  }
  #app { padding: 14px; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3); padding: 16px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 22px; color: #0f172a; }
  h2 { font-size: 17px; color: #0f172a; }
  .muted { color: #64748b; }
  .small { font-size: 13px; }
  .tiny { font-size: 11px; }
  .center { text-align: center; }
  .mt { margin-top: 14px; } .mt-s { margin-top: 8px; }
  .pos { color: #16a34a; } .neg { color: #dc2626; } .ctl { color: #b45309; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, select { font-family: inherit; font-size: 15px; }

  .hero { text-align: center; padding: 6px 0 2px; }
  .hero .lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #64748b; }
  .hero .big { font-size: 46px; font-weight: 800; line-height: 1.1; }
  .status { font-size: 12px; font-weight: 700; }
  .iconbtn { background: #e2e8f0; color: #0f172a; border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 14px; }
  .iconbtn:active { background: #cbd5e1; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 8px 13px; border-radius: 999px; background: #e2e8f0; color: #334155; font-weight: 700; font-size: 13px; }
  .chip.active { background: #2563eb; color: #fff; }
  .custom { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .custom input { padding: 8px 10px; border: 2px solid #cbd5e1; border-radius: 10px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 720px) { .kpis { grid-template-columns: 1fr 1fr; } }
  .kpi { background: #f1f5f9; border-radius: 12px; padding: 12px; }
  .kpi .k { font-size: 11px; font-weight: 800; color: #64748b; letter-spacing: .04em; }
  .kpi .v { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .kpi .s { font-size: 12px; color: #64748b; margin-top: 2px; }

  .chartbox { position: relative; height: 240px; }
  @media (max-width: 720px) { .chartbox { height: 210px; } }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  .grid2 > .card { margin-bottom: 0; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: #64748b; font-weight: 800; letter-spacing: .04em; padding: 6px 4px; border-bottom: 1px solid #e2e8f0; }
  td { padding: 9px 4px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; } tr.click:active td { background: #f1f5f9; }
  tr.sel td { background: #eff6ff; }

  .bar { height: 6px; border-radius: 3px; background: #e2e8f0; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools input, .tools select { padding: 9px 10px; border: 2px solid #cbd5e1; border-radius: 10px; background: #fff; }
  .tools input[type=search] { flex: 1; min-width: 160px; }

  .op { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; margin-bottom: 7px; cursor: pointer; }
  .op:active { filter: brightness(.96); }
  .op-in { background: #f0fdf4; } .op-out { background: #fef2f2; } .op-ctrl { background: #fffbeb; }
  .op-del { background: #f1f5f9; opacity: .6; } .op-del .amt { text-decoration: line-through; }
  .op .who { font-weight: 800; }
  .op .amt { font-size: 18px; font-weight: 800; white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; vertical-align: middle; }
  .p-in { background: #dcfce7; color: #166534; } .p-out { background: #fee2e2; color: #991b1b; }
  .p-ctrl { background: #fef3c7; color: #92400e; } .p-del { background: #e2e8f0; color: #475569; } .p-mod { background: #dbeafe; color: #1e40af; }
  .daysep { font-size: 12px; font-weight: 800; color: #64748b; margin: 12px 2px 6px; display: flex; justify-content: space-between; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; overflow-y: auto; }
  .modal { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto; margin: auto; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
  .kv b { text-align: right; }

  .btn { width: 100%; padding: 15px; border-radius: 14px; background: #2563eb; color: #fff; font-size: 18px; font-weight: 800; }
  .err { color: #dc2626; font-weight: 700; text-align: center; }
  .more { width: 100%; padding: 12px; border-radius: 12px; background: #e2e8f0; color: #0f172a; font-weight: 800; margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ============== CONFIG ============== */
/* Stesso database della Cassaforte. Questo sito fa SOLO letture (GET). */
var SUPABASE_URL = 'https://dwjoqezrywszsqzdzxge.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3am9xZXpyeXdzenNxemR6eGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNjA2NTQsImV4cCI6MjA5NTkzNjY1NH0.cRwNsJHZbZK_96Vg7qa5i2q5lRvnMIqite-LUt3zUlE';
var TABLE = 'transactions';
var USERS = ['Andrea', 'Massimo', 'Marzio', 'Marco'];
var SALDO_INIZIALE = 0;           // come nella Cassaforte (saldo iniziale = 0)
var AUTO_REFRESH_MS = 60000;

var K_PERIOD = 'cassaforte_view_period_v1';

/* ============== HELPERS ============== */
var fmtEur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', useGrouping: 'always' });
var fmtEur0 = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' });
function eur(n) { return fmtEur.format(n || 0); }
function eur0(n) { return fmtEur0.format(n || 0); }
function sgn(n) { return (n > 0 ? '+' : '') + eur(n); }
function cls(n) { return n > 0 ? 'pos' : (n < 0 ? 'neg' : 'muted'); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function parseDay(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fmtDT(d) {
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' +
         d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}
function fmtDayLong(d) { return d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
function fmtDayShort(d) { return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }); }
function typeLabel(t) { return t === 'deposito' ? 'Deposito' : (t === 'prelievo' ? 'Prelievo' : 'Controllo'); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ============== DATI ============== */
var ALL = [];          // tutte le operazioni (anche eliminate), ordine cronologico crescente
var loadedAt = null;
var loadError = '';
var loading = false;

function fetchAll() {
  var page = 1000, out = [];
  function step(from) {
    return fetch(SUPABASE_URL + '/rest/v1/' + TABLE + '?select=*&order=created_at.asc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Range': from + '-' + (from + page - 1) }
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (rows) {
      out = out.concat(rows);
      return rows.length === page ? step(from + page) : out;
    });
  }
  return step(0);
}

function load() {
  if (loading) return;
  loading = true; render();
  fetchAll().then(function (rows) {
    ALL = rows.map(function (r) {
      return {
        id: r.local_id || r.id,
        user: r.user_name || '—',
        type: r.transaction_type,
        amount: Number(r.amount) || 0,
        reason: (r.reason || '').trim(),
        at: new Date(r.created_at),
        upd: r.updated_at ? new Date(r.updated_at) : null,
        deleted: !!r.deleted,
        delAt: r.deleted_at ? new Date(r.deleted_at) : null
      };
    }).sort(function (a, b) { return a.at - b.at; });
    // saldo progressivo dopo ogni operazione (solo operazioni attive)
    var b = SALDO_INIZIALE;
    ALL.forEach(function (t) {
      t.modified = !t.deleted && t.upd && (t.upd - t.at > 60000);
      if (!t.deleted) b += t.amount;
      t.after = b;
    });
    loadedAt = new Date(); loadError = '';
  }).catch(function (e) {
    loadError = 'Non riesco a leggere i dati (' + e.message + '). Controlla la connessione.';
  }).then(function () { loading = false; render(); });
}

function active() { return ALL.filter(function (t) { return !t.deleted; }); }
function balanceBefore(d) {
  var b = SALDO_INIZIALE;
  for (var i = 0; i < ALL.length; i++) { var t = ALL[i]; if (t.at >= d) break; if (!t.deleted) b += t.amount; }
  return b;
}

/* ============== STATO ============== */
var state = {
  period: lsGet(K_PERIOD) || '30',
  from: '', to: '',
  user: 'Tutti',
  kind: 'tutti',        // tutti | entrate | uscite | controllo
  q: '',
  showDeleted: false,
  limit: 60,
  detail: null,         // id operazione aperta
  reasonOpen: null
};

function periodRange() {
  var today = startOfDay(new Date()), end = addDays(today, 1), start;
  switch (state.period) {
    case 'oggi': start = today; break;
    case 'ieri': start = addDays(today, -1); end = today; break;
    case '7': start = addDays(today, -6); break;
    case '30': start = addDays(today, -29); break;
    case 'mese': start = new Date(today.getFullYear(), today.getMonth(), 1); break;
    case 'mesep': start = new Date(today.getFullYear(), today.getMonth() - 1, 1); end = new Date(today.getFullYear(), today.getMonth(), 1); break;
    case 'anno': start = new Date(today.getFullYear(), 0, 1); break;
    case 'custom':
      start = state.from ? parseDay(state.from) : (ALL[0] ? startOfDay(ALL[0].at) : today);
      end = state.to ? addDays(parseDay(state.to), 1) : end;
      break;
    default: start = ALL[0] ? startOfDay(ALL[0].at) : today;   // tutto
  }
  return { start: start, end: end };
}

function inPeriod(rng) {
  return function (t) { return t.at >= rng.start && t.at < rng.end; };
}
function matchUser(t) { return state.user === 'Tutti' || t.user === state.user; }
function matchKind(t) {
  if (state.kind === 'entrate') return t.type !== 'controllo' && t.amount > 0;
  if (state.kind === 'uscite') return t.type !== 'controllo' && t.amount < 0;
  if (state.kind === 'controllo') return t.type === 'controllo';
  return true;
}
function matchQ(t) {
  var q = state.q.trim().toLowerCase();
  return !q || t.reason.toLowerCase().indexOf(q) >= 0 || t.user.toLowerCase().indexOf(q) >= 0 || String(Math.abs(t.amount)).indexOf(q) >= 0;
}

/* ============== RENDER ============== */
var charts = {};
function destroyCharts() { Object.keys(charts).forEach(function (k) { try { charts[k].destroy(); } catch (e) {} }); charts = {}; }

function render() {
  var app = document.getElementById('app');
  destroyCharts();
  if (!loadedAt) {
    app.innerHTML = '<div class="card center mt">' +
      (loadError ? '<div class="err">' + esc(loadError) + '</div><button class="btn mt" data-act="reload">Riprova</button>'
                 : '<div class="muted">Carico i dati della cassaforte…</div>') + '</div>';
    bindMain(); return;
  }
  var y = window.scrollY;
  app.innerHTML = renderMain() + (state.detail ? renderDetail() : '');
  bindMain();
  drawCharts();
  window.scrollTo(0, y);
}

function renderMain() {
  var act = active();
  var bal = act.reduce(function (s, t) { return s + t.amount; }, SALDO_INIZIALE);
  var rng = periodRange();
  var per = act.filter(inPeriod(rng));
  var perU = per.filter(matchUser);

  var ent = 0, usc = 0, ctl = 0, nE = 0, nU = 0;
  perU.forEach(function (t) {
    if (t.type === 'controllo') ctl += t.amount;
    else if (t.amount > 0) { ent += t.amount; nE++; }
    else { usc += t.amount; nU++; }
  });
  var b0 = balanceBefore(rng.start), b1 = balanceBefore(rng.end);
  var last = act[act.length - 1];

  var periods = [['oggi','Oggi'],['ieri','Ieri'],['7','7 giorni'],['30','30 giorni'],['mese','Questo mese'],['mesep','Mese scorso'],['anno','Anno'],['tutto','Tutto'],['custom','📅 Date']];
  var usersChips = ['Tutti'].concat(USERS).concat(['Controllo']);

  var h = '';
  /* --- testata con saldo --- */
  h += '<div class="card">' +
    '<div class="row"><h1>🔒 Cassaforte</h1>' +
      '<button class="iconbtn" data-act="reload" aria-label="Aggiorna dati">' + (loading ? '…' : '↻ Aggiorna') + '</button></div>' +
    '<div class="hero mt">' +
      '<div class="lbl">SALDO ATTUALE</div>' +
      '<div class="big ' + (bal >= 0 ? 'pos' : 'neg') + '">' + eur(bal) + '</div>' +
      (last ? '<div class="small muted mt-s">Ultima: <b>' + esc(last.user) + '</b> ' + sgn(last.amount) + ' — ' + esc(last.reason || '—') + ' · ' + fmtDT(last.at) + '</div>' : '') +
      '<div class="status mt-s ' + (loadError ? 'neg' : 'pos') + '">● ' + (loadError ? esc(loadError) : 'Aggiornato alle ' + loadedAt.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + ' · sola lettura') + '</div>' +
    '</div>' +
  '</div>';

  /* --- filtri --- */
  h += '<div class="card">' +
    '<div class="small muted" style="font-weight:800">PERIODO</div>' +
    '<div class="chips mt-s">' + periods.map(function (p) {
      return '<button class="chip' + (state.period === p[0] ? ' active' : '') + '" data-period="' + p[0] + '">' + p[1] + '</button>';
    }).join('') + '</div>' +
    (state.period === 'custom' ?
      '<div class="custom mt-s"><label class="small muted" for="dFrom">Dal</label><input type="date" id="dFrom" value="' + state.from + '">' +
      '<label class="small muted" for="dTo">al</label><input type="date" id="dTo" value="' + state.to + '"></div>' : '') +
    '<div class="small muted mt" style="font-weight:800">PERSONA</div>' +
    '<div class="chips mt-s">' + usersChips.map(function (u) {
      return '<button class="chip' + (state.user === u ? ' active' : '') + '" data-user="' + esc(u) + '">' + esc(u) + '</button>';
    }).join('') + '</div>' +
    '<div class="small muted mt">' + fmtDayLong(rng.start) + ' → ' + fmtDayLong(addDays(rng.end, -1)) + '</div>' +
  '</div>';

  /* --- KPI --- */
  h += '<div class="card"><div class="kpis">' +
    kpi('ENTRATE', '<span class="pos">' + eur(ent) + '</span>', nE + ' depositi') +
    kpi('USCITE', '<span class="neg">' + eur(usc) + '</span>', nU + ' prelievi') +
    kpi('NETTO', '<span class="' + cls(ent + usc + ctl) + '">' + sgn(ent + usc + ctl) + '</span>', ctl ? 'di cui controlli ' + sgn(ctl) : 'nessun controllo') +
    (state.user === 'Tutti'
      ? kpi('SALDO NEL PERIODO', eur0(b0) + ' → ' + eur0(b1), 'variazione ' + sgn(b1 - b0))
      : kpi('OPERAZIONI', String(perU.length), 'di ' + esc(state.user))) +
  '</div></div>';

  /* --- grafici --- */
  h += '<div class="grid2">' +
    '<div class="card"><h2>📈 Andamento saldo</h2><div class="small muted">saldo a fine giornata</div><div class="chartbox mt-s"><canvas id="chSaldo"></canvas></div></div>' +
    '<div class="card"><h2>📊 Entrate e uscite</h2><div class="small muted" id="flowLbl">&nbsp;</div><div class="chartbox mt-s"><canvas id="chFlow"></canvas></div></div>' +
  '</div><div class="mt"></div>';

  /* --- per persona + motivi --- */
  h += '<div class="grid2">' + renderPeople(per) + renderReasons(perU) + '</div><div class="mt"></div>';

  /* --- elenco operazioni --- */
  h += renderList(rng);

  h += '<p class="center tiny" style="color:#94a3b8;margin-top:8px">Sola visualizzazione — le operazioni si registrano solo dal tablet Cassaforte.</p>';
  return h;
}

function kpi(k, v, s) { return '<div class="kpi"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; }

function renderPeople(per) {
  var names = USERS.concat(['Controllo']);
  per.forEach(function (t) { if (names.indexOf(t.user) < 0) names.push(t.user); });
  var rows = names.map(function (u) {
    var r = { u: u, e: 0, x: 0, n: 0 };
    per.forEach(function (t) { if (t.user !== u) return; r.n++; if (t.amount > 0) r.e += t.amount; else r.x += t.amount; });
    return r;
  }).filter(function (r) { return r.n > 0; });
  var maxAbs = rows.reduce(function (m, r) { return Math.max(m, r.e, -r.x); }, 1);
  var body = rows.length ? rows.map(function (r) {
    return '<tr class="click' + (state.user === r.u ? ' sel' : '') + '" data-user="' + esc(r.u) + '">' +
      '<td><b>' + esc(r.u) + '</b><div class="tiny muted">' + r.n + ' operazioni</div>' +
        '<div class="bar"><i style="width:' + (r.e / maxAbs * 100).toFixed(1) + '%;background:#16a34a"></i></div>' +
        '<div class="bar"><i style="width:' + (-r.x / maxAbs * 100).toFixed(1) + '%;background:#dc2626"></i></div></td>' +
      '<td class="num pos">' + eur0(r.e) + '</td><td class="num neg">' + eur0(r.x) + '</td>' +
      '<td class="num ' + cls(r.e + r.x) + '"><b>' + eur0(r.e + r.x) + '</b></td></tr>';
  }).join('') : '<tr><td colspan="4" class="center muted">Nessuna operazione nel periodo</td></tr>';
  return '<div class="card"><h2>👥 Per persona</h2><div class="small muted">tocca una riga per filtrare</div>' +
    '<table class="mt-s"><thead><tr><th>CHI</th><th class="num">ENTRATE</th><th class="num">USCITE</th><th class="num">NETTO</th></tr></thead><tbody>' + body + '</tbody></table></div>';
}

/* raggruppa i motivi simili ("Vendita olio" = "vendita olio ") */
function reasonKey(s) { return (s || '—').toLowerCase().replace(/[^\p{L}\p{N} ]/gu, ' ').replace(/\s+/g, ' ').trim() || '—'; }
function renderReasons(perU) {
  function top(list, sign) {
    var g = {};
    list.forEach(function (t) {
      if (t.type === 'controllo' || (sign > 0 ? t.amount <= 0 : t.amount >= 0)) return;
      var k = reasonKey(t.reason);
      if (!g[k]) g[k] = { label: t.reason || '—', tot: 0, n: 0 };
      g[k].tot += t.amount; g[k].n++;
    });
    return Object.keys(g).map(function (k) { g[k].key = k; return g[k]; })
      .sort(function (a, b) { return Math.abs(b.tot) - Math.abs(a.tot); }).slice(0, 6);
  }
  function block(title, arr, color) {
    if (!arr.length) return '<div class="small muted mt-s">' + title + ': nessuna</div>';
    var max = Math.abs(arr[0].tot) || 1;
    return '<div class="small muted mt" style="font-weight:800">' + title + '</div>' + arr.map(function (r) {
      return '<div class="mt-s" style="cursor:pointer" data-q="' + esc(r.key) + '">' +
        '<div class="row small"><span>' + esc(r.label) + ' <span class="muted">×' + r.n + '</span></span><b class="' + cls(r.tot) + '">' + eur0(r.tot) + '</b></div>' +
        '<div class="bar"><i style="width:' + (Math.abs(r.tot) / max * 100).toFixed(1) + '%;background:' + color + '"></i></div></div>';
    }).join('');
  }
  return '<div class="card"><h2>🏷️ Motivi principali</h2><div class="small muted">tocca un motivo per vedere le operazioni</div>' +
    block('ENTRATE', top(perU, 1), '#16a34a') + block('USCITE', top(perU, -1), '#dc2626') + '</div>';
}

function renderList(rng) {
  var list = ALL.filter(inPeriod(rng)).filter(function (t) {
    return (state.showDeleted || !t.deleted) && matchUser(t) && matchKind(t) && matchQ(t);
  }).reverse();
  var tot = list.reduce(function (s, t) { return s + (t.deleted ? 0 : t.amount); }, 0);
  var shown = list.slice(0, state.limit);

  var body = '', curDay = '';
  shown.forEach(function (t) {
    var dk = dayKey(t.at);
    if (dk !== curDay) {
      curDay = dk;
      var dayTot = list.reduce(function (s, x) { return s + (!x.deleted && dayKey(x.at) === dk ? x.amount : 0); }, 0);
      body += '<div class="daysep"><span>' + fmtDayLong(t.at) + '</span><span class="' + cls(dayTot) + '">' + sgn(dayTot) + '</span></div>';
    }
    var c = t.deleted ? 'op-del' : (t.type === 'controllo' ? 'op-ctrl' : (t.amount >= 0 ? 'op-in' : 'op-out'));
    var p = t.type === 'controllo' ? 'p-ctrl' : (t.amount >= 0 ? 'p-in' : 'p-out');
    body += '<div class="op ' + c + '" data-id="' + esc(t.id) + '">' +
      '<div style="min-width:0"><div class="who">' + esc(t.user) + ' <span class="pill ' + p + '">' + typeLabel(t.type) + '</span>' +
        (t.deleted ? ' <span class="pill p-del">ELIMINATA</span>' : '') + (t.modified ? ' <span class="pill p-mod">MODIFICATA</span>' : '') + '</div>' +
        '<div class="small muted" style="overflow-wrap:anywhere">' + esc(t.reason || '—') + '</div>' +
        '<div class="tiny muted">' + t.at.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + (t.deleted ? '' : ' · saldo dopo ' + eur0(t.after)) + '</div></div>' +
      '<div class="amt ' + cls(t.amount) + '">' + sgn(t.amount) + '</div></div>';
  });
  if (!list.length) body = '<div class="center muted mt">Nessuna operazione con questi filtri</div>';
  if (list.length > shown.length) body += '<button class="more" data-act="more">Mostra altre (' + (list.length - shown.length) + ')</button>';

  return '<div class="card">' +
    '<div class="row"><h2>📋 Operazioni</h2><button class="iconbtn" data-act="csv">⬇️ CSV</button></div>' +
    '<div class="tools mt-s">' +
      '<input type="search" id="q" placeholder="Cerca motivo, persona, importo…" aria-label="Cerca" value="' + esc(state.q) + '">' +
      '<select id="kind" aria-label="Tipo">' +
        [['tutti','Tutti i tipi'],['entrate','Solo entrate'],['uscite','Solo uscite'],['controllo','Solo controlli']].map(function (o) {
          return '<option value="' + o[0] + '"' + (state.kind === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') + '</select>' +
      '<label class="small" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="showDel"' + (state.showDeleted ? ' checked' : '') + '> eliminate</label>' +
    '</div>' +
    '<div class="small muted mt-s">' + list.length + ' operazioni · totale <b class="' + cls(tot) + '">' + sgn(tot) + '</b></div>' +
    '<div class="mt-s">' + body + '</div>' +
  '</div>';
}

function renderDetail() {
  var t = null;
  for (var i = 0; i < ALL.length; i++) if (ALL[i].id === state.detail) { t = ALL[i]; break; }
  if (!t) return '';
  var before = t.deleted ? null : t.after - t.amount;
  // altre operazioni della stessa persona quel giorno
  var dk = dayKey(t.at);
  var same = ALL.filter(function (x) { return x !== t && !x.deleted && x.user === t.user && dayKey(x.at) === dk; });
  return '<div class="modal-bg" data-act="close"><div class="modal" role="dialog" aria-label="Dettaglio operazione">' +
    '<div class="row"><h2>Dettaglio operazione</h2><button class="iconbtn" data-act="close" aria-label="Chiudi">✕</button></div>' +
    '<div class="center mt"><div style="font-size:38px;font-weight:800" class="' + cls(t.amount) + '">' + sgn(t.amount) + '</div>' +
      '<div class="muted">' + esc(t.reason || '—') + '</div></div>' +
    '<div class="mt">' +
      kv('Chi', esc(t.user)) +
      kv('Tipo', typeLabel(t.type)) +
      kv('Data', fmtDayLong(t.at)) +
      kv('Ora', t.at.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' })) +
      (before != null ? kv('Saldo prima', eur(before)) + kv('Saldo dopo', '<span class="' + (t.after >= 0 ? 'pos' : 'neg') + '">' + eur(t.after) + '</span>') : '') +
      (t.modified ? kv('Ultima modifica', fmtDT(t.upd)) : '') +
      (t.deleted ? kv('Stato', '<span class="neg">Eliminata' + (t.delAt ? ' il ' + fmtDT(t.delAt) : '') + '</span>') : kv('Stato', 'Attiva')) +
    '</div>' +
    (same.length ? '<div class="small muted mt" style="font-weight:800">ALTRE OPERAZIONI DI ' + esc(t.user).toUpperCase() + ' QUEL GIORNO</div>' +
      same.map(function (x) {
        return '<div class="kv" style="cursor:pointer" data-id="' + esc(x.id) + '"><span>' + x.at.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + ' · ' + esc(x.reason || '—') + '</span><b class="' + cls(x.amount) + '">' + sgn(x.amount) + '</b></div>';
      }).join('') : '') +
  '</div></div>';
}
function kv(k, v) { return '<div class="kv"><span class="muted">' + k + '</span><b>' + v + '</b></div>'; }

/* ============== GRAFICI ============== */
function drawCharts() {
  if (typeof Chart === 'undefined') return;
  var rng = periodRange();
  var act = active();
  var today = startOfDay(new Date());
  var endDay = addDays(rng.end, -1); if (endDay > today) endDay = today;
  var days = []; for (var d = new Date(rng.start); d <= endDay; d = addDays(d, 1)) days.push(new Date(d));
  if (!days.length) days.push(new Date(rng.start));

  /* saldo a fine giornata (sempre totale cassaforte) */
  var b = balanceBefore(rng.start), i = 0, saldo = [];
  while (i < act.length && act[i].at < rng.start) i++;
  days.forEach(function (day) {
    var next = addDays(day, 1);
    while (i < act.length && act[i].at < next) { b += act[i].amount; i++; }
    saldo.push(Math.round(b * 100) / 100);
  });
  Chart.defaults.font.family = '-apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  Chart.defaults.color = '#64748b';
  var euroTick = function (v) { return eur0(v); };
  var el = document.getElementById('chSaldo');
  if (el) charts.saldo = new Chart(el, {
    type: 'line',
    data: { labels: days.map(fmtDayShort), datasets: [{ data: saldo, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.10)', fill: true, tension: 0, stepped: true, pointRadius: days.length > 40 ? 0 : 2, borderWidth: 2 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { title: function (c) { return fmtDayLong(days[c[0].dataIndex]); }, label: function (c) { return 'Saldo ' + eur(c.parsed.y); } } } },
      scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 7, maxRotation: 0 } }, y: { ticks: { callback: euroTick, maxTicksLimit: 6 }, grid: { color: '#f1f5f9' } } },
      onClick: function (e, els) { if (els.length) jumpToDay(days[els[0].index]); } }
  });

  /* entrate/uscite raggruppate per giorno, settimana o mese */
  var span = days.length, unit = span <= 45 ? 'giorno' : (span <= 210 ? 'settimana' : 'mese');
  var buckets = [], idx = {};
  function bkey(d) {
    if (unit === 'giorno') return dayKey(d);
    if (unit === 'mese') return d.getFullYear() + '-' + pad(d.getMonth() + 1);
    var m = addDays(startOfDay(d), -((d.getDay() + 6) % 7)); return dayKey(m);
  }
  function blabel(k) {
    if (unit === 'mese') { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('it-IT', { month: 'short', year: '2-digit' }); }
    return fmtDayShort(parseDay(k));
  }
  days.forEach(function (day) { var k = bkey(day); if (!(k in idx)) { idx[k] = buckets.length; buckets.push({ k: k, e: 0, u: 0, first: day }); } });
  act.filter(inPeriod(rng)).filter(matchUser).forEach(function (t) {
    if (t.type === 'controllo') return;
    var k = bkey(t.at); if (!(k in idx)) return;
    if (t.amount > 0) buckets[idx[k]].e += t.amount; else buckets[idx[k]].u += t.amount;
  });
  var lbl = document.getElementById('flowLbl');
  if (lbl) lbl.textContent = 'per ' + unit + (state.user !== 'Tutti' ? ' · ' + state.user : '') + ' · tocca una barra per il dettaglio';
  var el2 = document.getElementById('chFlow');
  if (el2) charts.flow = new Chart(el2, {
    type: 'bar',
    data: { labels: buckets.map(function (x) { return (unit === 'settimana' ? 'sett. ' : '') + blabel(x.k); }),
      datasets: [
        { label: 'Entrate', data: buckets.map(function (x) { return x.e; }), backgroundColor: '#16a34a', borderRadius: 3 },
        { label: 'Uscite', data: buckets.map(function (x) { return x.u; }), backgroundColor: '#dc2626', borderRadius: 3 }
      ] },
    options: { maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } }, tooltip: { callbacks: { label: function (c) { return c.dataset.label + ' ' + eur(c.parsed.y); },
        footer: function (c) { var x = buckets[c[0].dataIndex]; return 'Netto ' + sgn(x.e + x.u); } } } },
      scales: { x: { stacked: true, grid: { display: false }, ticks: { maxTicksLimit: 8, maxRotation: 0 } }, y: { stacked: true, ticks: { callback: euroTick, maxTicksLimit: 6 }, grid: { color: '#f1f5f9' } } },
      onClick: function (e, els) {
        if (!els.length) return;
        var x = buckets[els[0].index];
        if (unit === 'giorno') jumpToDay(x.first);
        else if (unit === 'settimana') setCustom(parseDay(x.k), addDays(parseDay(x.k), 6));
        else { var p = x.k.split('-'); setCustom(new Date(+p[0], +p[1] - 1, 1), new Date(+p[0], +p[1], 0)); }
      } }
  });
}

function setCustom(a, b) { state.period = 'custom'; state.from = dayKey(a); state.to = dayKey(b); state.limit = 60; render(); }
function jumpToDay(d) { setCustom(d, d); }

/* ============== CSV ============== */
function exportCSV() {
  var rng = periodRange();
  var list = ALL.filter(inPeriod(rng)).filter(function (t) { return (state.showDeleted || !t.deleted) && matchUser(t) && matchKind(t) && matchQ(t); });
  var rows = [['Data', 'Ora', 'Persona', 'Tipo', 'Motivo', 'Importo', 'Saldo dopo', 'Stato']];
  list.forEach(function (t) {
    rows.push([t.at.toLocaleDateString('it-IT'), t.at.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }), t.user, typeLabel(t.type),
      t.reason.replace(/[;\n]/g, ','), String(t.amount).replace('.', ','), t.deleted ? '' : String(t.after).replace('.', ','),
      t.deleted ? 'ELIMINATA' : (t.modified ? 'modificata' : 'attiva')]);
  });
  var blob = new Blob(['﻿' + rows.map(function (r) { return r.join(';'); }).join('\n')], { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cassaforte-andamento-' + dayKey(new Date()) + '.csv';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}

/* ============== EVENTI ============== */
function bindMain() {
  var app = document.getElementById('app');
  app.querySelectorAll('[data-act]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      var a = el.getAttribute('data-act');
      if (a === 'close') { if (e.target !== el) return; state.detail = null; render(); return; }
      e.preventDefault();
      if (a === 'reload') load();
      else if (a === 'more') { state.limit += 100; render(); }
      else if (a === 'csv') exportCSV();
    });
  });
  app.querySelectorAll('[data-period]').forEach(function (el) {
    el.addEventListener('click', function () {
      state.period = el.getAttribute('data-period'); state.limit = 60;
      if (state.period !== 'custom') lsSet(K_PERIOD, state.period);
      render();
    });
  });
  app.querySelectorAll('[data-user]').forEach(function (el) {
    el.addEventListener('click', function () {
      var u = el.getAttribute('data-user');
      state.user = (state.user === u && u !== 'Tutti') ? 'Tutti' : u; state.limit = 60; render();
    });
  });
  app.querySelectorAll('[data-q]').forEach(function (el) {
    el.addEventListener('click', function () {
      state.q = el.getAttribute('data-q'); state.limit = 60; render();
      var q = document.getElementById('q'); if (q) q.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });
  app.querySelectorAll('[data-id]').forEach(function (el) {
    el.addEventListener('click', function () { state.detail = el.getAttribute('data-id'); render(); });
  });
  var q = document.getElementById('q');
  if (q) q.addEventListener('input', function () {
    var pos = q.selectionStart; state.q = q.value; state.limit = 60; render();
    var q2 = document.getElementById('q'); if (q2) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} }
  });
  var kind = document.getElementById('kind');
  if (kind) kind.addEventListener('change', function () { state.kind = kind.value; render(); });
  var sd = document.getElementById('showDel');
  if (sd) sd.addEventListener('change', function () { state.showDeleted = sd.checked; render(); });
  var f = document.getElementById('dFrom'), t = document.getElementById('dTo');
  if (f) f.addEventListener('change', function () { state.from = f.value; render(); });
  if (t) t.addEventListener('change', function () { state.to = t.value; render(); });
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.detail) { state.detail = null; render(); } });

/* ============== AVVIO ============== */
render();
load();
setInterval(function () { var ae = document.activeElement && document.activeElement.tagName;
  if (!state.detail && document.visibilityState === 'visible' && ae !== 'INPUT' && ae !== 'SELECT') load(); }, AUTO_REFRESH_MS);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
</body>
